# src/main/resources/application.properties

# AWS RDS PostgreSQL Connection
spring.datasource.url=jdbc:postgresql://database-1.cv8e6gowgdpb.eu-north-1.rds.amazonaws.com:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Settings (Auto-creates tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Set the port for this microservice so it doesn't clash with Next.js
server.port=8080